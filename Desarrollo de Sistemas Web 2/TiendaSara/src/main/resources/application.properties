spring.application.name=TiendaSara

# URL de conexión (quitamos el integratedSecurity para poder usar username y password)
spring.datasource.url=jdbc:sqlserver://HOLAMUNDO\\SQLEXPRESS:1433;databaseName=TiendaSara;trustServerCertificate=true;encrypt=false

# nombre de usuario y contraseña para la conexión a la base de datos
spring.datasource.username=sa
spring.datasource.password=1234

# Configuración de JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

#agregamos un nuevo puerto del server ya que tenemos un error al ejecutar el proyecto ya que el puerto 8080 ya esta siendo utilizado por otro proceso
server.port=8081 